<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[WORLD NAME] - Timeline</title>
    <link rel="stylesheet" href="../styles/general.css">
    <link rel="stylesheet" href="../styles/timeline.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="manifest" href="../site.webmanifest">
  </head>

  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="../index.html" class="logo">
          <h1><i class="fas fa-dragon"></i> [WORLD NAME]</h1>
          <p class="tagline">[Your tagline here]</p>
        </a>
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="../index.html#world">World</a></li>
          <li><a href="../pages/characters.html">Characters</a></li>
          <li><a href="../pages/locations.html">Locations</a></li>
          <li><a href="../pages/lore.html">Lore</a></li>
        </ul>
        <button class="menu-toggle" id="menuToggle">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </nav>

    <!-- HERO -->
    <section class="timeline-hero">
      <div class="timeline-hero-overlay">
        <div class="timeline-hero-content">
          <h1><i class="fas fa-hourglass-half"></i> Timeline</h1>
          <p>Tagline.</p>
        </div>
      </div>
    </section>

    <main class="timeline-container">

      <!--
        ERA INDICATOR
        Shows the current era as the user scrolls.
        Updated by JS based on which events are visible.
      -->
      <div class="timeline-era-indicator" id="eraIndicator">
        <span id="eraLabel"><i class="fas fa-scroll"></i> Ancient Era Name</span>
      </div>

      <!-- VERTICAL LINE + EVENTS -->
      <div class="timeline-track" id="timelineTrack">
        <!-- Events injected by timeline.js -->
      </div>

    </main>

    <!-- MODAL -->
    <div class="timeline-modal" id="timelineModal">
      <div class="timeline-modal-content">
        <button class="close-timeline-modal" id="closeTimelineModal">&times;</button>
        <div class="timeline-modal-body" id="timelineModalBody">
          <!-- Injected by timeline.js -->
        </div>
      </div>
    </div>

    <button class="back-to-top" id="backToTop" aria-label="Voltar ao topo">
      <i class="fas fa-chevron-up"></i>
    </button>

    <footer class="footer">
      <p>[WORLD NAME] • Built with HTML, CSS, JavaScript & Love.</p>
      <p class="footer-note">[World created by [YOUR NAME]. Thanks to all our incredible players.]</p>
      <div class="footer-socials">
        <a href="https://www.youtube.com/@YourChannel" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-youtube"></i> YouTube
        </a>
      </div>
    </footer>

    <script src="../scripts/main.js"></script>
    <script src="../scripts/timeline.js"></script>
  </body>
</html>
